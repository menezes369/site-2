<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta name="theme-color" content="#090a09" />

  <meta
    name="description"
    content="Portfólio de edição de vídeo — Menezes."
  />

  <title>Menezes | Editor de Vídeo</title>

  <style>
    html,
    body,
    #root {
      margin: 0;
      min-height: 100%;
      background: #090a09;
    }

    body {
      min-height: 100vh;
    }
  </style>
</head>

<body>

  <div id="root"></div>

  <!-- React -->
  <script
    crossorigin
    src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js">
  </script>

  <!-- ReactDOM -->
  <script
    crossorigin
    src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js">
  </script>

  <!-- Babel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>

  <!-- Código React -->
  <script
    type="text/babel"
    data-presets="env,react"
    src="app.js">
  </script>

</html>
